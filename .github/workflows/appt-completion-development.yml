name: APPT bounded completion development
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated Lean module targets'
        default: 'APPT.SparsePolynomial'
        required: true
      cases:
        description: 'Optional space-separated bounded DAG cases'
        required: false
        default: ''
  push:
    branches: ['research/appt-completion-D']
    paths: ['formalizations/appt-qutrit-purity/APPT/SparsePolynomial.lean']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalizations/appt-qutrit-purity
          use-mathlib-cache: 'true'
          build: 'false'
          test: 'false'
      - name: Compile checked development targets
        working-directory: formalizations/appt-qutrit-purity
        env:
          TARGETS: ${{ inputs.targets || 'APPT.SparsePolynomial' }}
          CASES: ${{ inputs.cases }}
        run: |
          set -euo pipefail
          if [[ -n "$CASES" ]]; then
            read -r -a cases <<< "$CASES"
            args=()
            for c in "${cases[@]}"; do args+=(--case "$c"); done
            lake env python3 scripts/build_blocks.py "${args[@]}" --engine lake --jobs 2 --timeout 300 2>&1 | tee development.log
          else
            read -r -a modules <<< "$TARGETS"
            timeout 1800 lake build "${modules[@]}" 2>&1 | tee development.log
          fi
      - name: Paired trust-zero replay controls
        working-directory: formalizations/appt-qutrit-purity
        run: |
          if [[ -f ReplayControls.lean ]]; then
            lake env lean -j1 ReplayControls.lean 2>&1 | tee replay-controls.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-${{ github.sha }}
          path: |
            formalizations/appt-qutrit-purity/development.log
            formalizations/appt-qutrit-purity/replay-controls.log
            formalizations/appt-qutrit-purity/logs/blocks/
