name: APPT full entropy upper and saturation
on:
  push:
    branches: ['review/appt-entropy-global-20261014']
    paths: ['formalizations/appt-high-dimensional-review/**', '.github/workflows/appt-entropy-global.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entropy-global:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalizations/appt-high-dimensional-review
          use-mathlib-cache: 'true'
          build: 'false'
          test: 'false'
      - name: Fresh selected closure and exact-type trust-zero audit
        working-directory: formalizations/appt-high-dimensional-review
        shell: bash
        run: |
          set -euo pipefail
          python3 reproduce_entropy_global.py --fresh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appt-entropy-global-${{ github.sha }}
          path: |
            formalizations/appt-high-dimensional-review/verification/entropy-global-reproduction/
            formalizations/appt-high-dimensional-review/ENTROPY_GLOBAL_HASHES.json
            formalizations/appt-high-dimensional-review/APPTReview/
            formalizations/appt-high-dimensional-review/EntropyGlobalAudit.lean
            formalizations/appt-high-dimensional-review/reproduce_entropy_global.py
