name: Exact complex three-row permanent certificate

on:
  push:
    paths:
      - 'notes/complex-permanent-determinant/**'
      - '.github/workflows/complex-permanent-exact.yml'
  pull_request:
    paths:
      - 'notes/complex-permanent-determinant/**'
      - '.github/workflows/complex-permanent-exact.yml'

permissions:
  contents: read

jobs:
  proof-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact all-coefficient complex pencil norm
        shell: bash
        run: |
          python3 notes/complex-permanent-determinant/check_full_norm.py > /tmp/fullnorm-normal.txt
          python3 -O notes/complex-permanent-determinant/check_full_norm.py > /tmp/fullnorm-optimized.txt
          cmp /tmp/fullnorm-normal.txt /tmp/fullnorm-optimized.txt
          cmp /tmp/fullnorm-normal.txt notes/complex-permanent-determinant/results/full-norm-replay.txt
      - name: Full sharp complex coefficient lens, exact rational replay
        shell: bash
        run: |
          python3 notes/complex-permanent-determinant/check_lens.py > /tmp/lens-normal.txt
          python3 -O notes/complex-permanent-determinant/check_lens.py > /tmp/lens-optimized.txt
          cmp /tmp/lens-normal.txt /tmp/lens-optimized.txt
          cmp /tmp/lens-normal.txt notes/complex-permanent-determinant/results/lens-replay.txt
      - name: Exact Q(sqrt3) polynomial identities in both Python modes
        shell: bash
        run: |
          python3 notes/complex-permanent-determinant/check.py > /tmp/complex-normal.txt
          python3 -O notes/complex-permanent-determinant/check.py > /tmp/complex-optimized.txt
          cmp /tmp/complex-normal.txt /tmp/complex-optimized.txt
          cmp /tmp/complex-normal.txt notes/complex-permanent-determinant/results/replay.txt
      - name: Independent Q(i,sqrt3) Hermitian entrywise regression
        shell: bash
        run: |
          python3 notes/complex-permanent-determinant/check_matrix.py > /tmp/complex-matrix-normal.txt
          python3 -O notes/complex-permanent-determinant/check_matrix.py > /tmp/complex-matrix-optimized.txt
          cmp /tmp/complex-matrix-normal.txt /tmp/complex-matrix-optimized.txt
          cmp /tmp/complex-matrix-normal.txt notes/complex-permanent-determinant/results/matrix-replay.txt
      - name: Exact normalized tensor product witnesses
        shell: bash
        run: |
          python3 notes/complex-permanent-determinant/check_tensor.py > /tmp/tensor-normal.txt
          python3 -O notes/complex-permanent-determinant/check_tensor.py > /tmp/tensor-optimized.txt
          cmp /tmp/tensor-normal.txt /tmp/tensor-optimized.txt
          cmp /tmp/tensor-normal.txt notes/complex-permanent-determinant/results/tensor-replay.txt
      - name: Frozen package hashes
        shell: bash
        run: |
          cd notes/complex-permanent-determinant
          sha256sum -c SHA256SUMS
