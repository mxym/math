name: APPT qutrit n=8 finite certificate Lean check

on:
  workflow_dispatch:
  push:
    paths:
      - 'formalizations/appt-qutrit-purity/APPT/Finite24*'
      - 'formalizations/appt-qutrit-purity/APPT/SpectrumBound24.lean'
      - '.github/workflows/appt-n8-direct-lean.yml'
  pull_request:
    paths:
      - 'formalizations/appt-qutrit-purity/APPT/Finite24*'
      - 'formalizations/appt-qutrit-purity/APPT/SpectrumBound24.lean'
      - '.github/workflows/appt-n8-direct-lean.yml'

permissions:
  contents: read

jobs:
  finite24:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalizations/appt-qutrit-purity
          use-mathlib-cache: 'true'
          build: 'false'
          test: 'false'
      - name: Compile the exact 24-dimensional certificate and bridge
        working-directory: formalizations/appt-qutrit-purity
        shell: bash
        run: |
          set -euo pipefail
          lake build APPT.Finite24Bound
          lake build APPT.SpectrumBound24
      - name: Reject untrusted shortcuts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '(^|[[:space:]])(sorry|admit|axiom|native_decide)([[:space:]]|$)' \
             formalizations/appt-qutrit-purity/APPT/{Finite24,Finite24Bound,SpectrumBound24}.lean
