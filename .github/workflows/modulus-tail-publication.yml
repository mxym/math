name: Modulus and tail research publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modulus-tail-publication.yml'
      - 'preprints/006-modulus-nonlinear-similarity/v1/main.tex'
      - 'preprints/006-modulus-nonlinear-similarity/v1/verification/check_robust_cover.py'
      - 'preprints/007-tail-brenier-stability/v1/main.tex'
      - 'preprints/007-tail-brenier-stability/v1/verification/check_interpolation.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modulus-tail-publication
  cancel-in-progress: false

jobs:
  check-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Replay exact finite checks
        shell: bash
        run: |
          set -euo pipefail
          A=preprints/006-modulus-nonlinear-similarity/v1
          B=preprints/007-tail-brenier-stability/v1
          python3 "$A/verification/check_robust_cover.py" --self-test --output "$A/verification/self_test.json" > "$A/verification/run.txt"
          python3 -O "$A/verification/check_robust_cover.py" --self-test > /tmp/robust-optimized-mode.json
          python3 "$A/verification/check_robust_cover.py" "$A/verification/toy_robust_certificate.json" > "$A/verification/toy_result.json"
          python3 "$B/verification/check_interpolation.py" --output "$B/verification/exact_checks.json" | tee "$B/verification/run.txt"
          python3 -O "$B/verification/check_interpolation.py" --cases 20 --output "$B/verification/optimized_mode_checks.json"
      - name: Compile manuscripts
        shell: bash
        run: |
          set -euo pipefail
          for base in preprints/006-modulus-nonlinear-similarity/v1 preprints/007-tail-brenier-stability/v1; do
            (cd "$base" && pdflatex -interaction=nonstopmode -halt-on-error main.tex && pdflatex -interaction=nonstopmode -halt-on-error main.tex)
            cp "$base/main.pdf" "$base/paper.pdf"
            if grep -E 'LaTeX Warning: (Reference .* undefined|There were undefined references)' "$base/main.log"; then
              echo 'Unresolved references'; exit 1
            fi
          done
      - name: Record hashes and complete research archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          roots = [pathlib.Path('preprints/006-modulus-nonlinear-similarity'), pathlib.Path('preprints/007-tail-brenier-stability')]
          files = []
          for root in roots:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix in {'.md', '.tex', '.py', '.json', '.txt', '.pdf'} and p.name != 'main.pdf':
                      files.append(p)
          for name in ['third_party_licenses/openai_math_LICENSE.txt', 'NOTICE.md', 'verification/2026-10-07-cross-audit-and-extensions.md', 'notes/2026-10-07-modulus-avoidance-progress.md']:
              files.append(pathlib.Path(name))
          record = {'version': 'modulus-tail-20261007-v1', 'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'first_complete_source_commits': {'006': '478be8879564e99843ad0bc69ca6192379e5b59e', '007': '72eb17dfd6448f879192b6763b9b5c99b4c072f7'}, 'verification_scope': 'finite exact regression and PDF build; not independent peer review or proof-assistant formalization', 'sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(files)}}
          out = pathlib.Path('releases/modulus-tail-2026-10-07-v1.json'); out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          with zipfile.ZipFile('/tmp/modulus-tail-v1-complete.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(files)+[out]: z.write(p,str(p))
          PY
      - name: Commit only generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preprints/006-modulus-nonlinear-similarity/v1/paper.pdf preprints/006-modulus-nonlinear-similarity/v1/verification/self_test.json preprints/006-modulus-nonlinear-similarity/v1/verification/run.txt preprints/006-modulus-nonlinear-similarity/v1/verification/toy_result.json
          git add preprints/007-tail-brenier-stability/v1/paper.pdf preprints/007-tail-brenier-stability/v1/verification/exact_checks.json preprints/007-tail-brenier-stability/v1/verification/run.txt preprints/007-tail-brenier-stability/v1/verification/optimized_mode_checks.json releases/modulus-tail-2026-10-07-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build and replay modulus avoidance and tail-sensitive interpolation v1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=modulus-tail-20261007-v1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release is retained without replacement.'
            exit 0
          fi
          cp preprints/006-modulus-nonlinear-similarity/v1/paper.pdf /tmp/modulus-nonlinear-similarity-v1.pdf
          cp preprints/007-tail-brenier-stability/v1/paper.pdf /tmp/tail-brenier-stability-v1.pdf
          printf '%s\n' 'Two complete written research drafts: modulus-controlled nonlinear avoidance and tail-sensitive convex-gradient interpolation with unbounded-target transport applications.' 'Sources, proof audits, exact regression output and upstream provenance/license notices are included.' 'Not independently peer reviewed or proof-assistant formalized. Novelty and journal tier are not certified.' 'The nonlinear theorem does not cover all C1 or flat-smooth maps. The sharp interpolation exponent is not a sharpness claim for the Wasserstein map exponent. Transport applications explicitly depend on manuscript 001.' > /tmp/modulus-tail-release-notes.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title 'Nonlinear modulus avoidance and tail-sensitive Brenier stability v1' --notes-file /tmp/modulus-tail-release-notes.txt /tmp/modulus-nonlinear-similarity-v1.pdf /tmp/tail-brenier-stability-v1.pdf /tmp/modulus-tail-v1-complete.zip releases/modulus-tail-2026-10-07-v1.json
