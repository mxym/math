name: Gaussian four-cell partial kernel verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'formalizations/gaussian-four-global-progress/**'
      - 'formalizations/gaussian-measure-primal-dual/**'
      - 'formalizations/gaussian-mass-envelope-progress/**'
      - '.github/workflows/gaussian-four-global-partial.yml'
permissions:
  contents: read
jobs:
  partial-kernel-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check pinned sources, complete module inventory and audit roots
        working-directory: formalizations/gaussian-four-global-progress
        run: |
          python3 preflight.py
          python3 test_preflight.py
      - name: Install fixed Lean 4.34.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst --output "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Pinned dependencies and selected Mathlib cache
        working-directory: formalizations/gaussian-four-global-progress
        run: |
          set -euo pipefail
          bash fetch_cache.sh
      - name: Fresh Lake build, every module, empty-kernel replay and mutations
        working-directory: formalizations/gaussian-four-global-progress
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/gaussian-four-source-commit.txt"
          python3 reproduce.py --output-dir "$RUNNER_TEMP/gaussian-four-kernel-verification"
      - name: Surface the first Lean errors and preserve development objects
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gaussian-four-kernel-verification"
          if [ -d "$evidence" ]; then
            if [ -f "$RUNNER_TEMP/gaussian-four-source-commit.txt" ]; then
              cp "$RUNNER_TEMP/gaussian-four-source-commit.txt" "$evidence/source-commit.txt"
            fi
            if [ -f "$evidence/lake-build.log" ]; then
              grep -E '^error:|^Some required targets|^- Gaussian' "$evidence/lake-build.log" | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            fi
            tree="$evidence/lake-source"
            if [ -d "$tree" ] && [ '${{ job.status }}' != 'success' ]; then
              (cd "$tree" && find formalizations -type f -name '*.olean' -print0 | tar --null -T - -czf "$evidence/development-objects.tar.gz")
            fi
          fi
      - name: Preserve literal verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaussian-four-partial-kernel-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gaussian-four-kernel-verification/*.log
            ${{ runner.temp }}/gaussian-four-kernel-verification/*.json
            ${{ runner.temp }}/gaussian-four-kernel-verification/*.txt
            ${{ runner.temp }}/gaussian-four-kernel-verification/development-objects.tar.gz
            ${{ runner.temp }}/gaussian-four-kernel-verification/negative-*/**/*.lean
          if-no-files-found: warn
