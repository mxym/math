name: Tree compartment singular-locus exact verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/hydrology-tree-singular-locus/**'
      - '.github/workflows/hydrology-tree-singular-locus.yml'
permissions:
  contents: read
jobs:
  independent-exact-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install fixed symbolic dependencies
        working-directory: research/hydrology-tree-singular-locus
        run: python -m pip install -r requirements.txt
      - name: Isolated exact, symbolic, and negative-control checks
        working-directory: research/hydrology-tree-singular-locus
        run: |
          set -euo pipefail
          python reproduce.py --output-dir "$RUNNER_TEMP/tree-singular-verification"
          git rev-parse HEAD > "$RUNNER_TEMP/tree-singular-verification/source-commit.txt"
      - name: Preserve literal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-singular-exact-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tree-singular-verification/*.log
            ${{ runner.temp }}/tree-singular-verification/*.json
            ${{ runner.temp }}/tree-singular-verification/*.txt
          if-no-files-found: warn
