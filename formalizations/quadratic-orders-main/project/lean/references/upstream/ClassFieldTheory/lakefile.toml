name = "ClassFieldTheory"
version = "2.0.0"
defaultTargets = ["ClassFieldTheory.All"]
enableArtifactCache = false
restoreAllArtifacts = false

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "ClassFieldTheory.All"
srcDir = "Lean4"
globs = ["ClassFieldTheory.+"]
leanOptions = {linter.missingDocs = true}

[[lean_lib]]
name = "ValuedFieldTheory"
srcDir = "Lean4"
globs = ["ValuedFieldTheory.+"]

[[lean_lib]]
name = "GaloisCohomology"
srcDir = "Lean4"
globs = ["GaloisCohomology.+"]

[[lean_lib]]
name = "ProCGroups"
srcDir = "Lean4"
globs = ["ProCGroups.+"]
